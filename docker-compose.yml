services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tokokue_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d tokokue_test']
      interval: 2s
      timeout: 5s
      retries: 15
