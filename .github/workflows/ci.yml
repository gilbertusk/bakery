name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cek:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tokokue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d tokokue_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Database sekali pakai milik job ini, bukan kredensial asli.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tokokue_test
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/tokokue_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - name: Test unit + coverage
        run: pnpm test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Test integrasi
        run: pnpm test:int

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: '1'
